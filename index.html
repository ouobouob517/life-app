<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小日子 生活記錄</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff8fa3"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff3ee;--card:#fff;--ac:#ff8fa3;--ac2:#ffe0e6;--tx:#5a3d44;--mu:#a58a90;--ok:#6bbf94;--r:18px}
:root[data-theme=milk]{--bg:#f6ede3;--ac:#c49a6c;--ac2:#efdfcc;--tx:#4e3d2e;--mu:#9b8670}
:root[data-theme=mint]{--bg:#e9f7f1;--ac:#4fc0a0;--ac2:#cdeee3;--tx:#2f4f46;--mu:#7da296}
:root[data-theme=night]{--bg:#1d1b2a;--card:#2a2740;--ac:#b79cff;--ac2:#3a3560;--tx:#ece8ff;--mu:#9a94c2}
:root[data-theme=sky]{--bg:#eaf4ff;--ac:#5aa9f0;--ac2:#d3e8fc;--tx:#2c4560;--mu:#7f9bb5}
:root[data-theme=lavender]{--bg:#f3eefb;--ac:#a98be0;--ac2:#e4d8f6;--tx:#443660;--mu:#9a8bb5}
:root[data-theme=lemon]{--bg:#fff9e0;--ac:#f2b928;--ac2:#fdedb0;--tx:#5a4a1a;--mu:#a8985a}
:root[data-theme=cocoa]{--bg:#2b211d;--card:#3a2e29;--ac:#e6a77a;--ac2:#4d3d35;--tx:#f5e6da;--mu:#b39a8a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:15px}
main{max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
input,select,button{font:inherit;color:inherit;border:1.5px solid var(--ac2);background:var(--card);border-radius:12px;padding:8px 10px;min-width:0}
input,select{flex:1 1 110px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:var(--ac2);color:var(--tx)}button.s{padding:4px 10px;font-size:13px}
.chip{background:var(--ac2);color:var(--tx);padding:5px 12px;border-radius:99px;font-size:13px}.chip.on{background:var(--ac);color:#fff}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bub{background:var(--ac2);border-radius:16px;padding:12px;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px #0002}
nav a{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--ac);font-weight:700}nav a b{display:block;font-size:20px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ac2)}
details summary{cursor:pointer;color:var(--ac);font-weight:600;margin:6px 0}
.warn{color:#e0803a}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i), v=i=>($(i)||{}).value||'';
const OUT=[['餐飲','🍜'],['飲料','🧋'],['交通','🚌'],['日用品','🧴'],['醫療','💊'],['房租','🏠'],['娛樂','🎮'],['其他','🐾']];
const IC=Object.fromEntries(OUT.concat([['收入','💰']]));
const ICAT=['清潔','衛浴','廚房','保健品','食品','其他'];
const EMO=['🍜','🧋','☕','🍰','🛒','👕','📚','🎁','🐶','🐱','✈️','💡','🧼','🥬','🪥','💄','🧸','🏋️','🧾','🎬','🚗','🌸'];
const THEMES=[['peach','蜜桃粉'],['milk','奶茶色'],['mint','薄荷綠'],['sky','天空藍'],['lavender','薰衣草'],['lemon','檸檬黃'],['night','夜空紫'],['cocoa','可可棕']];
const DEF={cfg:{mods:{fin:1,home:1,health:1},theme:'peach',name:'我',budget:20000,carry:1,goal:{from:'',to:'',date:''},mascot:'🐰',custom:'',round:'18px'},tx:[],items:[],log:[],mem:{房租:'s',日用品:'s'},sync:{api:'',token:'',since:0,h:{}},cats:{out:OUT.map(c=>c.slice()),item:ICAT.map(n=>[n,{清潔:'🧼',衛浴:'🛁',廚房:'🍳',保健品:'💊',食品:'🥬',其他:'🐾'}[n]])}};
function load(){try{const s=JSON.parse(localStorage.getItem('lifeapp'));if(s){const D=JSON.parse(JSON.stringify(DEF));return {...D,...s,cfg:{...D.cfg,...s.cfg,mods:{...D.cfg.mods,...s.cfg.mods}}}}}catch(x){}return JSON.parse(JSON.stringify(DEF))}
let S=load(),tab='home',view='all';
let tmr,busy=0,ST={};const raw=()=>{try{localStorage.setItem('lifeapp',JSON.stringify(S))}catch(x){}};const save=()=>{raw();clearTimeout(tmr);tmr=setTimeout(sync,2500)};
const uid=()=>Math.random().toString(36).slice(2,9);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const money=n=>'$'+Math.round(n).toLocaleString();
const inView=t=>view==='all'||(view==='p'&&t.scope==='p')||(view==='s'&&t.scope==='s');
const vname={all:'全部',p:'我的',s:'家庭'};

const SEL={},NE={};
const icon=c=>(S.cats.out.concat(S.cats.item).find(x=>x[0]===c)||[0,c==='收入'?'💰':'🏷️'])[1];
const catOpts=k=>S.cats[k].map(c=>`<option value="${e(c[0])}" ${SEL[k]===c[0]?'selected':''}>${c[1]} ${e(c[0])}</option>`).join('')+'<option value="__new">＋新增類別…</option>';
const onCat=k=>{if(v(k==='out'?'a_cat':'i_cat')==='__new')$('nc_'+k).style.display='block';else if(k==='out')pickCat()};
const ncUI=k=>`<div id="nc_${k}" class="card" style="display:none;margin:8px 0;background:var(--bg)"><input id="ncn_${k}" placeholder="新類別名稱" style="width:100%"><div class="row" style="margin:8px 0">${EMO.map(m=>`<span class="chip" style="font-size:18px" onclick="NE['${k}']='${m}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</span>`).join('')}</div><button class="s" onclick="addCat('${k}')">新增這個類別</button></div>`;
function addCat(k){const n=v('ncn_'+k).trim();if(!n)return;if(!S.cats[k].find(c=>c[0]===n))S.cats[k].push([n,NE[k]||'🏷️']);SEL[k]=n;save();render()}
/* ---------- finance ---------- */
function fin(m){const A=S.tx.filter(inView);
 const cur=A.filter(t=>t.d.startsWith(m)),prior=A.filter(t=>t.d<m+'-01');
 const sum=(L,ty)=>L.filter(t=>t.type===ty).reduce((a,t)=>a+t.amt,0);
 const carry=S.cfg.carry?Math.max(0,sum(prior,'in')-sum(prior,'out')):0;
 return {cur,inc:sum(cur,'in')+carry,out:sum(cur,'out'),carry}}
function addTx(){const amt=+v('a_amt');if(!amt)return;
 const cat=v('a_cat'),scope=v('a_scope');if(cat==='__new')return;
 S.tx.unshift({id:uid(),d:v('a_d')||td(),amt,type:v('a_type'),cat:v('a_type')==='in'?'收入':cat,acct:v('a_acct'),note:v('a_note'),scope,by:S.cfg.name});
 S.mem[cat]=scope;save();render()}
function pickCat(){const c=v('a_cat');if(S.mem[c])$('a_scope').value=S.mem[c]}
function pFin(){const m=td().slice(0,7),f=fin(m),bal=f.inc-f.out;
 const cats={};f.cur.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
 const mx=Math.max(1,...Object.values(cats)),bp=Math.min(100,f.out/S.cfg.budget*100);
 return `<h1>💰 記帳</h1><div class="row" style="margin-bottom:10px">${['all','p','s'].map(k=>`<span class="chip ${view===k?'on':''}" onclick="view='${k}';render()">${vname[k]}</span>`).join('')}</div>
 <div class="card"><div class="row sp"><div><div class="mu">本月結餘(${vname[view]})</div><div class="big">${money(bal)}</div></div><div class="mu" style="text-align:right">收入 ${money(f.inc)}${f.carry?`<br>含上月結轉 ${money(f.carry)}`:''}<br>支出 ${money(f.out)}</div></div>
 <div class="bar" style="margin:10px 0 4px"><i style="width:${bp}%"></i></div><div class="mu">預算 ${money(S.cfg.budget)},已用 ${Math.round(bp)}% ${bp>=100?'(超過囉,下個月再調整就好 (・ω・))':''}</div></div>
 <div class="card"><h2>分類支出</h2>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row sp mu"><span>${icon(c)} ${c}</span><span>${money(n)}</span></div><div class="bar" style="margin:2px 0 8px"><i style="width:${n/mx*100}%"></i></div>`).join('')||'<div class="mu">還沒有支出 (´・ω・`)</div>'}</div>
 <div class="card"><h2>新增一筆</h2><div class="row"><select id="a_type"><option value="out">支出</option><option value="in">收入</option></select><input id="a_amt" type="number" inputmode="decimal" placeholder="金額"></div>
 <div class="row" style="margin-top:8px"><select id="a_cat" onchange="onCat('out')">${catOpts('out')}</select><select id="a_scope"><option value="p">👤 個人</option><option value="s">👨‍👩‍👧 共用</option></select><select id="a_acct"><option>現金</option><option>信用卡</option><option>電子支付</option></select></div>
 ${ncUI('out')}<div class="row" style="margin-top:8px"><input id="a_d" type="date" value="${td()}"><input id="a_note" placeholder="備註"></div><button style="margin-top:10px;width:100%" onclick="addTx()">記下來 ✨</button></div>
 <div class="card"><h2>最近紀錄</h2>${S.tx.filter(inView).slice(0,25).map(t=>`<div class="li"><span>${icon(t.cat)} ${e(t.cat)} <span class="mu">${e(t.note)} · ${t.d.slice(5)} · ${t.scope==='s'?'共用':'個人'}·${e(t.by)}</span></span><span>${t.type==='in'?'+':'-'}${money(t.amt)} <a onclick="S.tx=S.tx.filter(x=>x.id!='${t.id}');save();render()" class="mu">✕</a></span></div>`).join('')||'<div class="mu">空空的</div>'}</div>`}

/* ---------- household ---------- */
const stat=it=>{const us=(it.uses||[]).filter(u=>u.end),avg=us.length?us.reduce((a,u)=>a+days(u.open,u.end),0)/us.length:0,
 op=(it.uses||[]).find(u=>!u.end),left=op&&avg?Math.round(avg-days(op.open,td())):null;
 return {avg,op,left,low:(it.stock||0)<=0&&!op||(left!==null&&left<=7)}};
function addItem(){const n=v('i_name').trim();if(!n||v('i_cat')==='__new')return;S.items.push({id:uid(),name:n,cat:v('i_cat'),loc:v('i_loc'),stock:0,buys:[],uses:[]});save();render()}
function buy(id){const it=S.items.find(x=>x.id===id),p=+v('p_'+id),q=+v('q_'+id)||1;if(!p)return;
 it.buys.push({d:td(),price:p,qty:q,place:v('w_'+id)});it.stock=(it.stock||0)+q;
 if(S.cfg.mods.fin)S.tx.unshift({id:uid(),d:td(),amt:p*q,type:'out',cat:it.cat==='保健品'?'醫療':'日用品',acct:'現金',note:it.name,scope:'s',by:S.cfg.name});
 save();render()}
function openIt(id){const it=S.items.find(x=>x.id===id);if(it.stock<1||stat(it).op)return;it.stock--;it.uses.push({open:td()});save();render()}
function endIt(id){const u=S.items.find(x=>x.id===id).uses.find(x=>!x.end);if(u)u.end=td();save();render()}
function pHome(){const L=S.items;
 return `<h1>🧺 日用品</h1><div class="card"><h2>🛒 待買清單</h2>${L.filter(i=>stat(i).low).map(i=>`<div class="li"><span>${e(i.name)}</span><span class="mu">${e(i.loc)}</span></div>`).join('')||'<div class="mu">目前都夠用 (๑˃ᴗ˂)ﻭ</div>'}</div>
 <div class="card"><h2>新增品項</h2><div class="row"><input id="i_name" placeholder="名稱"><select id="i_cat" onchange="onCat('item')">${catOpts('item')}</select><input id="i_loc" placeholder="存放位置"></div>${ncUI('item')}<button style="margin-top:8px;width:100%" onclick="addItem()">加入</button></div>
 ${L.map(i=>{const s=stat(i),pl={};i.buys.forEach(b=>{const u=b.price;if(b.place&&(!pl[b.place]||u<pl[b.place]))pl[b.place]=u});
 return `<div class="card"><div class="row sp"><b>${e(i.name)}</b><span class="mu">${icon(i.cat)} ${e(i.cat)} · ${e(i.loc)||'未設定位置'}</span></div>
 <div class="mu">庫存 ${i.stock||0} ・ ${s.avg?`平均使用 ${Math.round(s.avg)} 天`:'還沒有使用週期資料'} ${s.op?`・使用中${s.left!==null?`,約剩 ${Math.max(0,s.left)} 天`:''}`:''} ${s.low?'<span class="warn">・快用完了</span>':''}</div>
 ${Object.keys(pl).length?`<div class="mu">價格:${Object.entries(pl).map(([k,x])=>e(k)+' '+money(x)).join(' / ')}</div>`:''}
 <div class="row" style="margin-top:8px"><button class="s g" onclick="openIt('${i.id}')">📦 開封</button><button class="s g" onclick="endIt('${i.id}')">✅ 用完</button><button class="s g" onclick="S.items=S.items.filter(x=>x.id!='${i.id}');save();render()">刪除</button></div>
 <details><summary>記錄購買</summary><div class="row"><input id="p_${i.id}" type="number" placeholder="單價"><input id="q_${i.id}" type="number" placeholder="數量" value="1"><input id="w_${i.id}" placeholder="購買地點"></div><button class="s" style="margin-top:6px" onclick="buy('${i.id}')">儲存${S.cfg.mods.fin?'(同時記一筆共用支出)':''}</button></details></div>`}).join('')}`}

/* ---------- health ---------- */
const lg=()=>S.log.slice().sort((a,b)=>a.d<b.d?-1:1);
const avgW=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function saveLog(){const d=v('h_d')||td();let r=S.log.find(x=>x.d===d);if(!r){r={d};S.log.push(r)}
 [['w','h_w'],['water','h_wa'],['sleep','h_s'],['ex','h_e']].forEach(([k,i])=>{if(v(i))r[k]=+v(i)});if(v('h_m'))r.mood=v('h_m');save();render()}
function saveGoal(){S.cfg.goal={from:v('g_f'),to:v('g_t'),date:v('g_d')};save();render()}
function coach(){const L=lg(),t=L.find(x=>x.d===td()),W=L.filter(x=>x.w),m=[];
 const pick=a=>a[new Date().getDate()%a.length];
 if(!t)m.push(pick(['今天還沒記錄也沒關係,想到再來找我就好 ( ˘ω˘ )','嗨嗨~今天過得怎麼樣呀 (੭ˊᵕˋ)੭','我在這裡陪你,慢慢來 (｡•ᴗ•｡)']));
 else m.push(pick(['今天有記錄,好棒喔 (๑>◡<๑)','謝謝你照顧自己 ♡(˃͈ ˂͈ )','又完成一件小事了,給你拍拍 (ﾉ´ω`)ﾉ']));
 const r=W.slice(-7).map(x=>x.w),p=W.slice(-14,-7).map(x=>x.w);
 if(r.length>=3&&p.length>=3){const d=avgW(r)-avgW(p);m.push(d<-0.05?`這週平均比上週輕了 ${Math.abs(d).toFixed(1)} 公斤,很不錯呢 (๑•̀ㅂ•́)و✧`:`體重本來就會上上下下喔,看一整週的趨勢就好 (੭ˊᵕˋ)੭`)}
 if(t&&t.water>=2000)m.push('水喝得很夠,身體會謝謝你 (≧▽≦)');else if(t&&t.water)m.push('再喝幾口水就更棒囉 (´▽`ʃ♡ƪ)');
 if(t&&t.sleep&&t.sleep<6)m.push('昨晚好像睡得有點少,今天對自己溫柔一點 (˘･_･˘)');
 const g=S.cfg.goal;if(g.from&&g.to&&g.date){const wk=days(td(),g.date)/7,per=wk>0?(g.from-g.to)/wk:99;
  if(per>1)m.push(`目標每週要減約 ${per.toFixed(1)} 公斤,稍微快了一點。可以把日期放寬些,有需要也可以問問醫師或營養師喔 (・ω・)`)}
 return m.join('<br>')}
function pHealth(){const L=lg(),W=L.filter(x=>x.w).slice(-30),g=S.cfg.goal;
 let svg='';if(W.length>1){const ys=W.map(x=>x.w),mn=Math.floor(Math.min(...ys)-.5),mx=Math.ceil(Math.max(...ys)+.5),L0=36,R0=10,T0=12,B0=26,w=320,h=180,sp=Math.max(1,days(W[0].d,W[W.length-1].d)),
 X=d=>L0+days(W[0].d,d)/sp*(w-L0-R0),Y=y=>T0+(1-(y-mn)/(mx-mn))*(h-T0-B0),
 ma=W.map((x,i)=>[x.d,avgW(W.slice(Math.max(0,i-6),i+1).map(y=>y.w))]),
 gy=[0,1,2,3].map(i=>mn+(mx-mn)*i/3),xi=[...new Set([0,1/3,2/3,1].map(f=>Math.round(f*(W.length-1))))];
 svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="font-size:9px;fill:var(--mu)">
 ${gy.map(g=>`<line x1="${L0}" x2="${w-R0}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--ac2)"/><text x="${L0-4}" y="${Y(g)+3}" text-anchor="end">${g.toFixed(1)}</text>`).join('')}
 <line x1="${L0}" x2="${L0}" y1="${T0}" y2="${h-B0}" stroke="var(--mu)"/><line x1="${L0}" x2="${w-R0}" y1="${h-B0}" y2="${h-B0}" stroke="var(--mu)"/>
 <text x="${L0-4}" y="8" text-anchor="end">kg</text>
 ${xi.map(i=>`<text x="${X(W[i].d)}" y="${h-10}" text-anchor="middle">${W[i].d.slice(5).replace('-','/')}</text>`).join('')}
 <polyline points="${W.map(x=>X(x.d)+','+Y(x.w)).join(' ')}" fill="none" stroke="var(--mu)" stroke-opacity=".5" stroke-width="1.5"/>
 ${W.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="2.5" style="fill:var(--mu)"/>`).join('')}
 <polyline points="${ma.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="mu">橫軸:日期 縱軸:體重(kg)・淺色=每日,深色=7日平均</div>`}
 return `<h1>🌿 健康</h1><div class="card"><h2>${S.cfg.mascot} 減重小助手</h2><div class="bub">${coach()}</div></div>
 <div class="card"><h2>今日記錄</h2><div class="row"><input id="h_d" type="date" value="${td()}"><input id="h_w" type="number" step="0.1" placeholder="體重 kg"><input id="h_wa" type="number" placeholder="飲水 ml"></div>
 <div class="row" style="margin-top:8px"><input id="h_s" type="number" step="0.5" placeholder="睡眠 小時"><input id="h_e" type="number" placeholder="運動 分鐘"><select id="h_m"><option value="">心情</option><option>😊</option><option>😐</option><option>😢</option><option>😴</option></select></div><button style="margin-top:8px;width:100%" onclick="saveLog()">儲存</button></div>
 <div class="card"><h2>體重趨勢</h2>${svg||'<div class="mu">記錄兩天以上就會出現圖 (´・ω・`)</div>'}</div>
 <div class="card"><h2>我的小目標(可不填)</h2><div class="row"><input id="g_f" type="number" placeholder="目前 kg" value="${e(g.from)}"><input id="g_t" type="number" placeholder="目標 kg" value="${e(g.to)}"><input id="g_d" type="date" value="${e(g.date)}"></div><button class="g" style="margin-top:8px" onclick="saveGoal()">設定</button><div class="mu" style="margin-top:6px">這只是陪伴參考,不是考試。減重有疑慮請諮詢醫師或營養師。</div></div>
 <div class="card"><h2>最近紀錄</h2>${L.slice(-7).reverse().map(x=>`<div class="li"><span>${x.d.slice(5)} ${x.mood||''}</span><span class="mu">${x.w?x.w+'kg ':''}${x.water?'💧'+x.water+' ':''}${x.sleep?'😴'+x.sleep+'h ':''}${x.ex?'🏃'+x.ex+'分':''}</span></div>`).join('')||'<div class="mu">還沒有紀錄</div>'}</div>`}

/* ---------- cloud sync ---------- */
const hs=o=>{const t=JSON.stringify(o);let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h};
async function api(path,body){const y=S.sync,r=await fetch(y.api.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+y.token},body:body?JSON.stringify(body):undefined});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
const docs=()=>{const c={};S.tx.forEach(t=>c['tx:'+t.id]={scope:t.scope,data:t});S.items.forEach(i=>c['item:'+i.id]={scope:'s',data:i});S.log.forEach(l=>c['log:'+l.d]={scope:'p',data:l});c.cfg={scope:'p',data:{cfg:S.cfg,mem:S.mem,cats:S.cats}};return c};
function ap(res,y){let n=0;const c=docs(),ks=[];
 for(const d of res.docs){const k=d.k,i=k.indexOf(':'),t=k.slice(0,i),id=k.slice(i+1);
  if(k==='cfg'){if(!d.del){if(hs(d.data)!==hs(c.cfg.data)){Object.assign(S.cfg,d.data.cfg);S.mem=d.data.mem;S.cats=d.data.cats;n++}ks.push(k)}continue}
  const L={tx:S.tx,item:S.items,log:S.log}[t];if(!L)continue;const f=t==='log'?'d':'id',j=L.findIndex(x=>x[f]===id);
  if(d.del){if(j>=0){L.splice(j,1);n++}delete y.h[k]}
  else if(j<0){L.push(d.data);n++;ks.push(k)}
  else{if(hs(d.data)!==hs(L[j])){L[j]=d.data;n++}ks.push(k)}}
 S.tx.sort((a,b)=>a.d<b.d?1:-1);
 const c2=docs();ks.forEach(k=>{if(c2[k])y.h[k]=[hs(c2[k].data),c2[k].scope]});y.since=res.now-5000;return n}
async function sync(){const y=S.sync;if(!y.token||!y.api||busy)return;busy=1;let n=0;
 try{if(!y.since)n+=ap(await api('/api/sync',{since:0,docs:[]}),y);
  const c=docs(),now=Date.now(),push=[];
  for(const k in c){const h=hs(c[k].data);if(!y.h[k]||y.h[k][0]!==h)push.push({k,scope:c[k].scope,data:c[k].data,u:now,h})}
  for(const k in y.h)if(!(k in c))push.push({k,del:1,scope:y.h[k][1],u:now});
  for(let i=0;i<Math.max(1,push.length);i+=100){const ch=push.slice(i,i+100);
   const r=await api('/api/sync',{since:y.since,docs:ch.map(({h,...d})=>d)});
   ch.forEach(d=>{if(d.del)delete y.h[d.k];else y.h[d.k]=[d.h,d.scope]});n+=ap(r,y)}
  ST.msg=''}catch(x){ST.msg='同步失敗:'+x.message}
 busy=0;raw();if(n)render()}
async function startPair(){try{const y=S.sync,r=await fetch(y.api.replace(/\/$/,'')+'/api/pair',{method:'POST'}).then(r=>r.json());y.token=r.token;ST={code:r.code,bot:r.bot};raw();render();poll()}catch(x){ST.msg='連線失敗,請確認後端網址';render()}}
async function poll(){if(!ST.code)return;try{const m=await api('/api/me');if(m.bound){ST={};raw();sync();render();return}}catch(x){if(String(x.message)==='auth'){S.sync.token='';ST={msg:'配對碼已過期,請重新連結'};raw();render();return}}setTimeout(poll,3000)}
async function loadMe(){ST.me={};try{ST.me=await api('/api/me')}catch(x){ST.me={err:1}}render()}
async function savePrefs(){try{await api('/api/prefs',{name:S.cfg.name,hour:+v('r_h'),stock:$('r_s').checked,health:$('r_hh').checked,fin:$('r_f').checked});ST.msg='已儲存提醒設定'}catch(x){ST.msg='儲存失敗'}loadMe()}
async function mkInv(){try{ST.inv=(await api('/api/family/invite',{})).code}catch(x){ST.msg='產生失敗'}render()}
async function joinFam(){try{await api('/api/family/join',{code:v('j_c').trim()});S.sync.since=0;ST.msg='已加入家庭!';await sync();loadMe();return}catch(x){ST.msg=x.message}render()}
function setApi(){S.sync.api=v('s_api').trim();raw();render()}
function unlink(){if(confirm('中斷連線並清除後端網址?資料仍保留在本機。')){S.sync={api:'',token:'',since:0,h:{}};ST={};raw();render()}}
const cloud=()=>{const y=S.sync,m=ST.me;let h='<div class="card"><h2>☁️ 雲端同步與 Telegram</h2>';
 if(!y.api)h+='<div class="mu">貼上後端網址(部署 Worker 後取得)</div><div class="row"><input id="s_api" placeholder="https://life-api.xxx.workers.dev"><button class="s" onclick="setApi()">儲存</button></div>';
 else if(!y.token)h+='<button onclick="startPair()">連結 Telegram</button>';
 else if(ST.code)h+=`<div class="bub">請在 Telegram 對 @${e(ST.bot)} 傳送這組配對碼:<div class="big">${ST.code}</div>10 分鐘內有效,成功後會自動更新。</div>`;
 else if(m&&m.bound){h+=`<div class="mu">✅ 已連線・家庭成員:${m.members.map(e).join('、')}</div>
 <div class="row" style="margin:8px 0"><button class="s" onclick="sync().then(render)">立即同步</button><button class="s g" onclick="mkInv()">產生家人邀請碼</button></div>${ST.inv?`<div class="bub">邀請碼 <b>${ST.inv}</b>(24 小時內有效),請家人在自己的 App 輸入。</div>`:''}
 <div class="row" style="margin:8px 0"><input id="j_c" placeholder="輸入邀請碼加入家庭"><button class="s" onclick="joinFam()">加入</button></div>
 <h2 style="margin-top:10px">Telegram 提醒</h2><div class="row"><select id="r_h">${[...Array(24).keys()].map(i=>`<option value="${i}" ${m.prefs.hour===i?'selected':''}>每天 ${i}:00</option>`).join('')}</select></div>
 ${[['r_s','stock','日用品快用完'],['r_hh','health','健康鼓勵'],['r_f','fin','今天還沒記帳']].map(([i,k,n])=>`<label class="li"><span>${n}</span><input id="${i}" type="checkbox" style="flex:none" ${m.prefs[k]?'checked':''}></label>`).join('')}<button class="s" onclick="savePrefs()">儲存提醒設定</button>`}
 else h+='<div class="mu">'+(m&&m.err?'連線失敗,請確認後端網址與網路':'載入中…')+'</div>';
 return h+(ST.msg?`<div class="mu" style="margin-top:6px">${e(ST.msg)}</div>`:'')+(y.api?'<div class="mu" style="margin-top:8px"><a onclick="unlink()">中斷連線/更換網址</a></div>':'')+'</div>'};
/* ---------- overview & settings ---------- */
function pMain(){const m=S.cfg.mods,t=td(),f=fin(t.slice(0,7)),today=S.tx.filter(x=>x.d===t&&x.type==='out').reduce((a,x)=>a+x.amt,0);
 return `<h1>${S.cfg.mascot} 嗨,${e(S.cfg.name)}!</h1>
 ${m.fin?`<div class="card" onclick="tab='fin';render()"><div class="mu">💰 今日支出</div><div class="big">${money(today)}</div><div class="mu">本月結餘 ${money(f.inc-f.out)}</div></div>`:''}
 ${m.home?`<div class="card" onclick="tab='home';render()"><div class="mu">🧺 快用完的品項</div>${S.items.filter(i=>stat(i).low).map(i=>`<div>${e(i.name)}</div>`).join('')||'<div class="mu">目前都夠用 (๑˃ᴗ˂)ﻭ</div>'}</div>`:''}
 ${m.health?`<div class="card" onclick="tab='health';render()"><div class="mu">🌿 小助手說</div><div class="bub" style="margin-top:6px">${coach()}</div></div>`:''}
 ${!m.fin&&!m.home&&!m.health?'<div class="card mu">到「設定」開啟想用的功能吧 ✨</div>':''}`}
function setMod(k,x){S.cfg.mods[k]=x?1:0;save();render()}
function pSet(){const c=S.cfg;return `<h1>⚙️ 設定</h1><div class="card"><h2>顯示的功能</h2>${[['fin','💰 記帳'],['home','🧺 日用品'],['health','🌿 健康']].map(([k,n])=>`<label class="li"><span>${n}</span><input type="checkbox" style="flex:none" ${c.mods[k]?'checked':''} onchange="setMod('${k}',this.checked)"></label>`).join('')}</div>
 <div class="card"><h2>風格</h2><div class="row">${THEMES.map(([k,n])=>`<span class="chip ${c.theme===k?'on':''}" onclick="S.cfg.theme='${k}';save();render()">${n}</span>`).join('')}</div>
 <div class="mu" style="margin:10px 0 4px">自訂主色</div><div class="row"><input type="color" style="flex:none;padding:2px;width:48px;height:36px" value="${c.custom||'#ff8fa3'}" onchange="S.cfg.custom=this.value;save();render()"><button class="g s" onclick="S.cfg.custom='';save();render()">還原主題色</button></div>
 <div class="mu" style="margin:10px 0 4px">圓角</div><div class="row">${[['8px','方正'],['18px','圓潤'],['30px','超圓']].map(([k,n])=>`<span class="chip ${c.round===k?'on':''}" onclick="S.cfg.round='${k}';save();render()">${n}</span>`).join('')}</div>
 <div class="mu" style="margin:10px 0 4px">吉祥物</div><div class="row">${['🐰','🐱','🐻','🐶','🦊','🐼','🐥'].map(k=>`<span class="chip ${c.mascot===k?'on':''}" onclick="S.cfg.mascot='${k}';save();render()">${k}</span>`).join('')}</div></div>
 <div class="card"><h2>我的類別</h2>${[['out','記帳'],['item','日用品']].map(([k,n])=>`<div class="mu" style="margin-top:6px">${n}</div><div class="row">${S.cats[k].map((x,i)=>`<span class="chip">${x[1]} ${e(x[0])} <a onclick="S.cats['${k}'].splice(${i},1);save();render()">✕</a></span>`).join('')}</div>`).join('')}<div class="mu" style="margin-top:8px">新增類別:到記帳或日用品的類別選單,選「＋新增類別」</div></div>
 <div class="card"><h2>個人設定</h2><div class="row"><input value="${e(c.name)}" placeholder="暱稱" onchange="S.cfg.name=this.value;save()"><input type="number" value="${c.budget}" onchange="S.cfg.budget=+this.value||0;save()"></div><div class="mu">左:暱稱(顯示為記帳者) 右:每月預算</div>
 <label class="li"><span>上月結餘自動轉為本月收入</span><input type="checkbox" style="flex:none" ${c.carry?'checked':''} onchange="S.cfg.carry=this.checked?1:0;save();render()"></label></div>
 ${cloud()}<div class="card mu">資料先存在這台裝置,連上雲端後會自動同步。<br><button class="g s" style="margin-top:8px" onclick="if(confirm('確定清除全部資料?')){S=JSON.parse(JSON.stringify(DEF));save();render()}">清除全部資料</button></div>`}

function render(){const m=S.cfg.mods;if(tab==='set'&&S.sync.token&&!ST.me&&!ST.code){ST.me={};loadMe()}document.documentElement.dataset.theme=S.cfg.theme;const rs=document.documentElement.style;rs.setProperty('--r',S.cfg.round||'18px');S.cfg.custom?(rs.setProperty('--ac',S.cfg.custom),rs.setProperty('--ac2','color-mix(in srgb,'+S.cfg.custom+' 22%,var(--card))')):(rs.removeProperty('--ac'),rs.removeProperty('--ac2'));
 const T=[['main','🏠','總覽'],m.fin&&['fin','💰','記帳'],m.home&&['home','🧺','日用品'],m.health&&['health','🌿','健康'],['set','⚙️','設定']].filter(Boolean);
 if(tab==='home'&&!m.home&&!T.find(x=>x[0]==='home'))tab='main';
 if(!T.find(x=>x[0]===tab))tab='main';
 $('nav').innerHTML=T.map(([k,i,n])=>`<a class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</a>`).join('');
 $('app').innerHTML={main:pMain,fin:pFin,home:pHome,health:pHealth,set:pSet}[tab]()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tab='main';render();sync();document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script></body></html>
