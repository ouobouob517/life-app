<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小日子 生活記錄</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff3ee;--card:#fff;--ac:#ff8fa3;--ac2:#ffe0e6;--tx:#5a3d44;--mu:#a58a90;--ok:#6bbf94}
:root[data-theme=milk]{--bg:#f6ede3;--ac:#c49a6c;--ac2:#efdfcc;--tx:#4e3d2e;--mu:#9b8670}
:root[data-theme=mint]{--bg:#e9f7f1;--ac:#4fc0a0;--ac2:#cdeee3;--tx:#2f4f46;--mu:#7da296}
:root[data-theme=night]{--bg:#1d1b2a;--card:#2a2740;--ac:#b79cff;--ac2:#3a3560;--tx:#ece8ff;--mu:#9a94c2}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:15px}
main{max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
input,select,button{font:inherit;color:inherit;border:1.5px solid var(--ac2);background:var(--card);border-radius:12px;padding:8px 10px;min-width:0}
input,select{flex:1 1 110px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:var(--ac2);color:var(--tx)}button.s{padding:4px 10px;font-size:13px}
.chip{background:var(--ac2);color:var(--tx);padding:5px 12px;border-radius:99px;font-size:13px}.chip.on{background:var(--ac);color:#fff}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bub{background:var(--ac2);border-radius:16px;padding:12px;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px #0002}
nav a{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--ac);font-weight:700}nav a b{display:block;font-size:20px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ac2)}
details summary{cursor:pointer;color:var(--ac);font-weight:600;margin:6px 0}
.warn{color:#e0803a}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i), v=i=>($(i)||{}).value||'';
const OUT=[['餐飲','🍜'],['飲料','🧋'],['交通','🚌'],['日用品','🧴'],['醫療','💊'],['房租','🏠'],['娛樂','🎮'],['其他','🐾']];
const IC=Object.fromEntries(OUT.concat([['收入','💰']]));
const ICAT=['清潔','衛浴','廚房','保健品','食品','其他'];
const THEMES=[['peach','蜜桃粉'],['milk','奶茶色'],['mint','薄荷綠'],['night','夜空紫']];
const DEF={cfg:{mods:{fin:1,home:1,health:1},theme:'peach',name:'我',budget:20000,carry:1,goal:{from:'',to:'',date:''}},tx:[],items:[],log:[],mem:{房租:'s',日用品:'s'}};
function load(){try{const s=JSON.parse(localStorage.getItem('lifeapp'));if(s)return {...DEF,...s,cfg:{...DEF.cfg,...s.cfg,mods:{...DEF.cfg.mods,...s.cfg.mods}}}}catch(x){}return JSON.parse(JSON.stringify(DEF))}
let S=load(),tab='home',view='all';
const save=()=>{try{localStorage.setItem('lifeapp',JSON.stringify(S))}catch(x){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const money=n=>'$'+Math.round(n).toLocaleString();
const inView=t=>view==='all'||(view==='p'&&t.scope==='p')||(view==='s'&&t.scope==='s');
const vname={all:'全部',p:'我的',s:'家庭'};

/* ---------- finance ---------- */
function fin(m){const A=S.tx.filter(inView);
 const cur=A.filter(t=>t.d.startsWith(m)),prior=A.filter(t=>t.d<m+'-01');
 const sum=(L,ty)=>L.filter(t=>t.type===ty).reduce((a,t)=>a+t.amt,0);
 const carry=S.cfg.carry?Math.max(0,sum(prior,'in')-sum(prior,'out')):0;
 return {cur,inc:sum(cur,'in')+carry,out:sum(cur,'out'),carry}}
function addTx(){const amt=+v('a_amt');if(!amt)return;
 const cat=v('a_cat'),scope=v('a_scope');
 S.tx.unshift({id:uid(),d:v('a_d')||td(),amt,type:v('a_type'),cat:v('a_type')==='in'?'收入':cat,acct:v('a_acct'),note:v('a_note'),scope,by:S.cfg.name});
 S.mem[cat]=scope;save();render()}
function pickCat(){const c=v('a_cat');if(S.mem[c])$('a_scope').value=S.mem[c]}
function pFin(){const m=td().slice(0,7),f=fin(m),bal=f.inc-f.out;
 const cats={};f.cur.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
 const mx=Math.max(1,...Object.values(cats)),bp=Math.min(100,f.out/S.cfg.budget*100);
 return `<h1>💰 記帳</h1><div class="row" style="margin-bottom:10px">${['all','p','s'].map(k=>`<span class="chip ${view===k?'on':''}" onclick="view='${k}';render()">${vname[k]}</span>`).join('')}</div>
 <div class="card"><div class="row sp"><div><div class="mu">本月結餘(${vname[view]})</div><div class="big">${money(bal)}</div></div><div class="mu" style="text-align:right">收入 ${money(f.inc)}${f.carry?`<br>含上月結轉 ${money(f.carry)}`:''}<br>支出 ${money(f.out)}</div></div>
 <div class="bar" style="margin:10px 0 4px"><i style="width:${bp}%"></i></div><div class="mu">預算 ${money(S.cfg.budget)},已用 ${Math.round(bp)}% ${bp>=100?'(超過囉,下個月再調整就好 (・ω・))':''}</div></div>
 <div class="card"><h2>分類支出</h2>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row sp mu"><span>${IC[c]||'🐾'} ${c}</span><span>${money(n)}</span></div><div class="bar" style="margin:2px 0 8px"><i style="width:${n/mx*100}%"></i></div>`).join('')||'<div class="mu">還沒有支出 (´・ω・`)</div>'}</div>
 <div class="card"><h2>新增一筆</h2><div class="row"><select id="a_type"><option value="out">支出</option><option value="in">收入</option></select><input id="a_amt" type="number" inputmode="decimal" placeholder="金額"></div>
 <div class="row" style="margin-top:8px"><select id="a_cat" onchange="pickCat()">${OUT.map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join('')}</select><select id="a_scope"><option value="p">👤 個人</option><option value="s">👨‍👩‍👧 共用</option></select><select id="a_acct"><option>現金</option><option>信用卡</option><option>電子支付</option></select></div>
 <div class="row" style="margin-top:8px"><input id="a_d" type="date" value="${td()}"><input id="a_note" placeholder="備註"></div><button style="margin-top:10px;width:100%" onclick="addTx()">記下來 ✨</button></div>
 <div class="card"><h2>最近紀錄</h2>${S.tx.filter(inView).slice(0,25).map(t=>`<div class="li"><span>${IC[t.cat]||'🐾'} ${e(t.cat)} <span class="mu">${e(t.note)} · ${t.d.slice(5)} · ${t.scope==='s'?'共用':'個人'}·${e(t.by)}</span></span><span>${t.type==='in'?'+':'-'}${money(t.amt)} <a onclick="S.tx=S.tx.filter(x=>x.id!='${t.id}');save();render()" class="mu">✕</a></span></div>`).join('')||'<div class="mu">空空的</div>'}</div>`}

/* ---------- household ---------- */
const stat=it=>{const us=(it.uses||[]).filter(u=>u.end),avg=us.length?us.reduce((a,u)=>a+days(u.open,u.end),0)/us.length:0,
 op=(it.uses||[]).find(u=>!u.end),left=op&&avg?Math.round(avg-days(op.open,td())):null;
 return {avg,op,left,low:(it.stock||0)<=0&&!op||(left!==null&&left<=7)}};
function addItem(){const n=v('i_name').trim();if(!n)return;S.items.push({id:uid(),name:n,cat:v('i_cat'),loc:v('i_loc'),stock:0,buys:[],uses:[]});save();render()}
function buy(id){const it=S.items.find(x=>x.id===id),p=+v('p_'+id),q=+v('q_'+id)||1;if(!p)return;
 it.buys.push({d:td(),price:p,qty:q,place:v('w_'+id)});it.stock=(it.stock||0)+q;
 if(S.cfg.mods.fin)S.tx.unshift({id:uid(),d:td(),amt:p*q,type:'out',cat:it.cat==='保健品'?'醫療':'日用品',acct:'現金',note:it.name,scope:'s',by:S.cfg.name});
 save();render()}
function openIt(id){const it=S.items.find(x=>x.id===id);if(it.stock<1||stat(it).op)return;it.stock--;it.uses.push({open:td()});save();render()}
function endIt(id){const u=S.items.find(x=>x.id===id).uses.find(x=>!x.end);if(u)u.end=td();save();render()}
function pHome(){const L=S.items;
 return `<h1>🧺 日用品</h1><div class="card"><h2>🛒 待買清單</h2>${L.filter(i=>stat(i).low).map(i=>`<div class="li"><span>${e(i.name)}</span><span class="mu">${e(i.loc)}</span></div>`).join('')||'<div class="mu">目前都夠用 (๑˃ᴗ˂)ﻭ</div>'}</div>
 <div class="card"><h2>新增品項</h2><div class="row"><input id="i_name" placeholder="名稱"><select id="i_cat">${ICAT.map(c=>`<option>${c}</option>`).join('')}</select><input id="i_loc" placeholder="存放位置"></div><button style="margin-top:8px;width:100%" onclick="addItem()">加入</button></div>
 ${L.map(i=>{const s=stat(i),pl={};i.buys.forEach(b=>{const u=b.price;if(b.place&&(!pl[b.place]||u<pl[b.place]))pl[b.place]=u});
 return `<div class="card"><div class="row sp"><b>${e(i.name)}</b><span class="mu">${e(i.cat)} · ${e(i.loc)||'未設定位置'}</span></div>
 <div class="mu">庫存 ${i.stock||0} ・ ${s.avg?`平均使用 ${Math.round(s.avg)} 天`:'還沒有使用週期資料'} ${s.op?`・使用中${s.left!==null?`,約剩 ${Math.max(0,s.left)} 天`:''}`:''} ${s.low?'<span class="warn">・快用完了</span>':''}</div>
 ${Object.keys(pl).length?`<div class="mu">價格:${Object.entries(pl).map(([k,x])=>e(k)+' '+money(x)).join(' / ')}</div>`:''}
 <div class="row" style="margin-top:8px"><button class="s g" onclick="openIt('${i.id}')">📦 開封</button><button class="s g" onclick="endIt('${i.id}')">✅ 用完</button><button class="s g" onclick="S.items=S.items.filter(x=>x.id!='${i.id}');save();render()">刪除</button></div>
 <details><summary>記錄購買</summary><div class="row"><input id="p_${i.id}" type="number" placeholder="單價"><input id="q_${i.id}" type="number" placeholder="數量" value="1"><input id="w_${i.id}" placeholder="購買地點"></div><button class="s" style="margin-top:6px" onclick="buy('${i.id}')">儲存${S.cfg.mods.fin?'(同時記一筆共用支出)':''}</button></details></div>`}).join('')}`}

/* ---------- health ---------- */
const lg=()=>S.log.slice().sort((a,b)=>a.d<b.d?-1:1);
const avgW=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function saveLog(){const d=v('h_d')||td();let r=S.log.find(x=>x.d===d);if(!r){r={d};S.log.push(r)}
 [['w','h_w'],['water','h_wa'],['sleep','h_s'],['ex','h_e']].forEach(([k,i])=>{if(v(i))r[k]=+v(i)});if(v('h_m'))r.mood=v('h_m');save();render()}
function saveGoal(){S.cfg.goal={from:v('g_f'),to:v('g_t'),date:v('g_d')};save();render()}
function coach(){const L=lg(),t=L.find(x=>x.d===td()),W=L.filter(x=>x.w),m=[];
 const pick=a=>a[new Date().getDate()%a.length];
 if(!t)m.push(pick(['今天還沒記錄也沒關係,想到再來找我就好 ( ˘ω˘ )','嗨嗨~今天過得怎麼樣呀 (੭ˊᵕˋ)੭','我在這裡陪你,慢慢來 (｡•ᴗ•｡)']));
 else m.push(pick(['今天有記錄,好棒喔 (๑>◡<๑)','謝謝你照顧自己 ♡(˃͈ ˂͈ )','又完成一件小事了,給你拍拍 (ﾉ´ω`)ﾉ']));
 const r=W.slice(-7).map(x=>x.w),p=W.slice(-14,-7).map(x=>x.w);
 if(r.length>=3&&p.length>=3){const d=avgW(r)-avgW(p);m.push(d<-0.05?`這週平均比上週輕了 ${Math.abs(d).toFixed(1)} 公斤,很不錯呢 (๑•̀ㅂ•́)و✧`:`體重本來就會上上下下喔,看一整週的趨勢就好 (੭ˊᵕˋ)੭`)}
 if(t&&t.water>=2000)m.push('水喝得很夠,身體會謝謝你 (≧▽≦)');else if(t&&t.water)m.push('再喝幾口水就更棒囉 (´▽`ʃ♡ƪ)');
 if(t&&t.sleep&&t.sleep<6)m.push('昨晚好像睡得有點少,今天對自己溫柔一點 (˘･_･˘)');
 const g=S.cfg.goal;if(g.from&&g.to&&g.date){const wk=days(td(),g.date)/7,per=wk>0?(g.from-g.to)/wk:99;
  if(per>1)m.push(`目標每週要減約 ${per.toFixed(1)} 公斤,稍微快了一點。可以把日期放寬些,有需要也可以問問醫師或營養師喔 (・ω・)`)}
 return m.join('<br>')}
function pHealth(){const L=lg(),W=L.filter(x=>x.w).slice(-14),g=S.cfg.goal;
 let svg='';if(W.length>1){const ys=W.map(x=>x.w),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5;
  const pts=W.map((x,i)=>`${10+i*(280/(W.length-1))},${70-(x.w-mn)/(mx-mn)*60}`).join(' ');
  const ma=W.map((x,i)=>{const s=W.slice(Math.max(0,i-6),i+1).map(y=>y.w);return `${10+i*(280/(W.length-1))},${70-(avgW(s)-mn)/(mx-mn)*60}`}).join(' ');
  svg=`<svg viewBox="0 0 300 80" width="100%"><polyline points="${pts}" fill="none" stroke="var(--ac2)" stroke-width="2"/><polyline points="${ma}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round"/></svg><div class="mu">淺色=每日,深色=7日平均</div>`}
 return `<h1>🌿 健康</h1><div class="card"><h2>🐰 減重小助手</h2><div class="bub">${coach()}</div></div>
 <div class="card"><h2>今日記錄</h2><div class="row"><input id="h_d" type="date" value="${td()}"><input id="h_w" type="number" step="0.1" placeholder="體重 kg"><input id="h_wa" type="number" placeholder="飲水 ml"></div>
 <div class="row" style="margin-top:8px"><input id="h_s" type="number" step="0.5" placeholder="睡眠 小時"><input id="h_e" type="number" placeholder="運動 分鐘"><select id="h_m"><option value="">心情</option><option>😊</option><option>😐</option><option>😢</option><option>😴</option></select></div><button style="margin-top:8px;width:100%" onclick="saveLog()">儲存</button></div>
 <div class="card"><h2>體重趨勢</h2>${svg||'<div class="mu">記錄兩天以上就會出現圖 (´・ω・`)</div>'}</div>
 <div class="card"><h2>我的小目標(可不填)</h2><div class="row"><input id="g_f" type="number" placeholder="目前 kg" value="${e(g.from)}"><input id="g_t" type="number" placeholder="目標 kg" value="${e(g.to)}"><input id="g_d" type="date" value="${e(g.date)}"></div><button class="g" style="margin-top:8px" onclick="saveGoal()">設定</button><div class="mu" style="margin-top:6px">這只是陪伴參考,不是考試。減重有疑慮請諮詢醫師或營養師。</div></div>
 <div class="card"><h2>最近紀錄</h2>${L.slice(-7).reverse().map(x=>`<div class="li"><span>${x.d.slice(5)} ${x.mood||''}</span><span class="mu">${x.w?x.w+'kg ':''}${x.water?'💧'+x.water+' ':''}${x.sleep?'😴'+x.sleep+'h ':''}${x.ex?'🏃'+x.ex+'分':''}</span></div>`).join('')||'<div class="mu">還沒有紀錄</div>'}</div>`}

/* ---------- overview & settings ---------- */
function pMain(){const m=S.cfg.mods,t=td(),f=fin(t.slice(0,7)),today=S.tx.filter(x=>x.d===t&&x.type==='out').reduce((a,x)=>a+x.amt,0);
 return `<h1>🐰 嗨,${e(S.cfg.name)}!</h1>
 ${m.fin?`<div class="card" onclick="tab='fin';render()"><div class="mu">💰 今日支出</div><div class="big">${money(today)}</div><div class="mu">本月結餘 ${money(f.inc-f.out)}</div></div>`:''}
 ${m.home?`<div class="card" onclick="tab='home';render()"><div class="mu">🧺 快用完的品項</div>${S.items.filter(i=>stat(i).low).map(i=>`<div>${e(i.name)}</div>`).join('')||'<div class="mu">目前都夠用 (๑˃ᴗ˂)ﻭ</div>'}</div>`:''}
 ${m.health?`<div class="card" onclick="tab='health';render()"><div class="mu">🌿 小助手說</div><div class="bub" style="margin-top:6px">${coach()}</div></div>`:''}
 ${!m.fin&&!m.home&&!m.health?'<div class="card mu">到「設定」開啟想用的功能吧 ✨</div>':''}`}
function setMod(k,x){S.cfg.mods[k]=x?1:0;save();render()}
function pSet(){const c=S.cfg;return `<h1>⚙️ 設定</h1><div class="card"><h2>顯示的功能</h2>${[['fin','💰 記帳'],['home','🧺 日用品'],['health','🌿 健康']].map(([k,n])=>`<label class="li"><span>${n}</span><input type="checkbox" style="flex:none" ${c.mods[k]?'checked':''} onchange="setMod('${k}',this.checked)"></label>`).join('')}</div>
 <div class="card"><h2>風格</h2><div class="row">${THEMES.map(([k,n])=>`<span class="chip ${c.theme===k?'on':''}" onclick="S.cfg.theme='${k}';save();render()">${n}</span>`).join('')}</div></div>
 <div class="card"><h2>個人設定</h2><div class="row"><input value="${e(c.name)}" placeholder="暱稱" onchange="S.cfg.name=this.value;save()"><input type="number" value="${c.budget}" onchange="S.cfg.budget=+this.value||0;save()"></div><div class="mu">左:暱稱(顯示為記帳者) 右:每月預算</div>
 <label class="li"><span>上月結餘自動轉為本月收入</span><input type="checkbox" style="flex:none" ${c.carry?'checked':''} onchange="S.cfg.carry=this.checked?1:0;save();render()"></label></div>
 <div class="card mu">目前資料存在這個瀏覽器裡。家人共用與 Telegram 提醒需要後端(Cloudflare Workers + D1)。<br><button class="g s" style="margin-top:8px" onclick="if(confirm('確定清除全部資料?')){S=JSON.parse(JSON.stringify(DEF));save();render()}">清除全部資料</button></div>`}

function render(){const m=S.cfg.mods;document.documentElement.dataset.theme=S.cfg.theme;
 const T=[['main','🏠','總覽'],m.fin&&['fin','💰','記帳'],m.home&&['home','🧺','日用品'],m.health&&['health','🌿','健康'],['set','⚙️','設定']].filter(Boolean);
 if(tab==='home'&&!m.home&&!T.find(x=>x[0]==='home'))tab='main';
 if(!T.find(x=>x[0]===tab))tab='main';
 $('nav').innerHTML=T.map(([k,i,n])=>`<a class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</a>`).join('');
 $('app').innerHTML={main:pMain,fin:pFin,home:pHome,health:pHealth,set:pSet}[tab]()}
tab='main';render();
</script></body></html>
