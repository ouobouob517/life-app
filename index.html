<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小日子 生活記錄</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#fff3ee"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff3ee;--card:#fff;--ac:#ff8fa3;--ac2:#ffe0e6;--tx:#5a3d44;--mu:#a58a90;--ok:#6bbf94;--r:18px}
:root[data-theme=milk]{--bg:#f6ede3;--ac:#c49a6c;--ac2:#efdfcc;--tx:#4e3d2e;--mu:#9b8670}
:root[data-theme=mint]{--bg:#e9f7f1;--ac:#4fc0a0;--ac2:#cdeee3;--tx:#2f4f46;--mu:#7da296}
:root[data-theme=night]{--bg:#1d1b2a;--card:#2a2740;--ac:#b79cff;--ac2:#3a3560;--tx:#ece8ff;--mu:#9a94c2}
:root[data-theme=sky]{--bg:#eaf4ff;--ac:#5aa9f0;--ac2:#d3e8fc;--tx:#2c4560;--mu:#7f9bb5}
:root[data-theme=lavender]{--bg:#f3eefb;--ac:#a98be0;--ac2:#e4d8f6;--tx:#443660;--mu:#9a8bb5}
:root[data-theme=lemon]{--bg:#fff9e0;--ac:#f2b928;--ac2:#fdedb0;--tx:#5a4a1a;--mu:#a8985a}
:root[data-theme=cocoa]{--bg:#2b211d;--card:#3a2e29;--ac:#e6a77a;--ac2:#4d3d35;--tx:#f5e6da;--mu:#b39a8a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:15px}
main{max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
input,select,button{font:inherit;color:inherit;border:1.5px solid var(--ac2);background:var(--card);border-radius:12px;padding:8px 10px;min-width:0}
input,select{flex:1 1 110px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:var(--ac2);color:var(--tx)}button.s{padding:4px 10px;font-size:13px}
.chip{background:var(--ac2);color:var(--tx);padding:5px 12px;border-radius:99px;font-size:13px}.chip.on{background:var(--ac);color:#fff}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bub{background:var(--ac2);border-radius:16px;padding:12px;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px #0002}
nav a{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--ac);font-weight:700}nav a b{display:block;font-size:20px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ac2)}
details summary{cursor:pointer;color:var(--ac);font-weight:600;margin:6px 0}
.warn{color:#e0803a}html{background:var(--bg)}
.tr{display:grid;grid-template-columns:40px 80px 1fr 86px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ac2);cursor:pointer}.tr>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.am{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i), v=i=>($(i)||{}).value||'';
const OUT=[['餐飲','🍜'],['飲料','🧋'],['交通','🚌'],['日用品','🧴'],['醫療','💊'],['房租','🏠'],['娛樂','🎮'],['其他','🐾']];
const IC=Object.fromEntries(OUT.concat([['收入','💰']]));
const ICAT=['清潔','衛浴','廚房','保健品','食品','其他'];
const EMO=['🍜','🧋','☕','🍰','🛒','👕','📚','🎁','🐶','🐱','✈️','💡','🧼','🥬','🪥','💄','🧸','🏋️','🧾','🎬','🚗','🌸'];
const THEMES=[['peach','蜜桃粉'],['milk','奶茶色'],['mint','薄荷綠'],['sky','天空藍'],['lavender','薰衣草'],['lemon','檸檬黃'],['night','夜空紫'],['cocoa','可可棕']];
const DEF={cfg:{mods:{fin:1,home:1,health:1},theme:'peach',name:'我',budget:20000,carry:1,goal:{from:'',to:'',date:''},mascot:'🐰',custom:'',round:'18px',cardClose:23,cardPay:10},tx:[],items:[],log:[],mem:{房租:'s',日用品:'s'},sync:{api:'',token:'',since:0,h:{}},cards:[{id:'c1',name:'國泰',close:23,pay:10},{id:'c2',name:'華南',close:23,pay:10},{id:'c3',name:'其他',close:23,pay:10}],cats:{out:OUT.map(c=>c.slice()),item:ICAT.map(n=>[n,{清潔:'🧼',衛浴:'🛁',廚房:'🍳',保健品:'💊',食品:'🥬',其他:'🐾'}[n]])}};
function load(){try{const s=JSON.parse(localStorage.getItem('lifeapp'));if(s){const D=JSON.parse(JSON.stringify(DEF));return {...D,...s,cfg:{...D.cfg,...s.cfg,mods:{...D.cfg.mods,...s.cfg.mods}}}}}catch(x){}return JSON.parse(JSON.stringify(DEF))}
const DEFLOC=()=>[['廚房','🍳'],['浴室','🛁'],['客廳','🛋️'],['臥室','🛏️'],['儲藏室','📦'],['冰箱','🧊']];
let S=load(),tab='home',view='all';S.cats.loc=S.cats.loc||DEFLOC();
let tmr,busy=0,ST={};const raw=()=>{try{localStorage.setItem('lifeapp',JSON.stringify(S))}catch(x){}};const save=()=>{raw();clearTimeout(tmr);tmr=setTimeout(sync,2500)};
const uid=()=>Math.random().toString(36).slice(2,9);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const money=n=>'$'+Math.round(n).toLocaleString();
const inView=t=>view==='all'||(view==='p'&&t.scope==='p')||(view==='s'&&t.scope==='s');
const vname={all:'全部',p:'我的',s:'家庭'};

const SEL={},NE={};
const icon=c=>(S.cats.out.concat(S.cats.item).find(x=>x[0]===c)||[0,c==='收入'?'💰':'🏷️'])[1];
const catOpts=(k,cur)=>S.cats[k].map(c=>`<option value="${e(c[0])}" ${(cur||SEL[k])===c[0]?'selected':''}>${c[1]} ${e(c[0])}</option>`).join('')+`<option value="__new">＋新增${k==='loc'?'位置':'類別'}…</option>`;
const onCat=k=>{if(v({out:'a_cat',item:'i_cat',loc:'i_loc'}[k])==='__new')$('nc_'+k).style.display='block';else if(k==='out')pickCat()};
const ncUI=k=>`<div id="nc_${k}" class="card" style="display:none;margin:8px 0;background:var(--bg)"><input id="ncn_${k}" placeholder="${k==='loc'?'新位置名稱':'新類別名稱'}" style="width:100%"><div class="row" style="margin:8px 0">${EMO.map(m=>`<span class="chip" style="font-size:18px" onclick="NE['${k}']='${m}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</span>`).join('')}</div><button class="s" onclick="addCat('${k}')">新增這個類別</button></div>`;
function addCat(k){const n=v('ncn_'+k).trim();if(!n)return;if(!S.cats[k].find(c=>c[0]===n))S.cats[k].push([n,NE[k]||'🏷️']);SEL[k]=n;save();render()}
/* ---------- finance ---------- */
let EDT=null,EIT=null,MON=td().slice(0,7),CSEL='',LSEL='',CL=[],ELG=null,FSUB='gen',CSELC='',SSEL='';
const PAL=['#ff8fa3','#f2b928','#4fc0a0','#5aa9f0','#a98be0','#e6a77a','#8bd17c','#f08a5d','#7f8fa6','#d46fb5'];
const p2=n=>String(n).padStart(2,'0'),dim=(y,m)=>new Date(y,m,0).getDate(),fmt=(y,m,d)=>y+'-'+p2(m)+'-'+p2(Math.min(d,dim(y,m)));
const addM=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+p2(m)};
const mdl=d=>(+d.slice(5,7))+'/'+(+d.slice(8,10));
const CC=()=>+S.cfg.cardClose||23,CP=()=>+S.cfg.cardPay||10;
const crd=t=>S.cards.find(c=>c.id===t.card)||{id:'_',name:'未指定',close:CC(),pay:CP()};
const clOf=(d,c)=>{const[y,m,dd]=d.split('-').map(Number),n=dd>c.close?addM(y+'-'+p2(m),1):y+'-'+p2(m);return fmt(+n.slice(0,4),+n.slice(5),c.close)};
const pyOf=(cl,c)=>{const n=addM(cl.slice(0,7),c.pay<=c.close?1:0);return fmt(+n.slice(0,4),+n.slice(5),c.pay)};
const cardTx=()=>S.tx.filter(t=>t.acct==='信用卡'&&t.type==='out'&&inView(t));
function allCards(){const cs=S.cards.slice();if(cardTx().some(t=>!S.cards.find(c=>c.id===t.card)))cs.push({id:'_',name:'未指定',close:CC(),pay:CP()});return cs}
function cardInfo(c){const st={};cardTx().filter(t=>crd(t).id===c.id).forEach(t=>{const k=clOf(t.d,c);(st[k]=st[k]||{sum:0,list:[]}).sum+=t.amt;st[k].list.push(t)});
 const cur=clOf(td(),c),pm=addM(cur.slice(0,7),-1),prev=fmt(+pm.slice(0,4),+pm.slice(5),c.close),ps=(st[prev]||{sum:0}).sum;
 return{c,st,cur,curPay:pyOf(cur,c),curSum:(st[cur]||{sum:0}).sum,prev,prevPay:pyOf(prev,c),prevSum:ps,unpaid:pyOf(prev,c)>=td()&&ps>0}}
function cardLine(){const I=allCards().map(cardInfo),u=I.filter(x=>x.unpaid);return u.length?`待繳 ${money(u.reduce((a,x)=>a+x.prevSum,0))}(最近 ${mdl(u.map(x=>x.prevPay).sort()[0])} 前)`:`本期刷卡 ${money(I.reduce((a,x)=>a+x.curSum,0))}`}
function fin(m){const A=S.tx.filter(inView);
 const cur=A.filter(t=>t.d.startsWith(m)),prior=A.filter(t=>t.d<m+'-01');
 const sum=(L,ty)=>L.filter(t=>t.type===ty).reduce((a,t)=>a+t.amt,0);
 const carry=S.cfg.carry?Math.max(0,sum(prior,'in')-sum(prior,'out')):0;
 return {cur,inc:sum(cur,'in')+carry,out:sum(cur,'out'),carry}}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:9;transition:opacity .3s';document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,1800)}
function addTx(){const amt=+v('a_amt');if(!amt)return;const cat=v('a_cat'),scope=v('a_scope'),ty=v('a_type');if(cat==='__new'&&ty==='out')return;
 const o={d:v('a_d')||td(),amt,type:ty,cat:ty==='in'?'收入':cat,acct:v('a_acct'),card:v('a_acct')==='信用卡'?v('a_card'):'',note:v('a_note'),scope};if(o.card)S.cfg.lastCard=o.card;
 if(EDT)Object.assign(S.tx.find(x=>x.id===EDT),o);else S.tx.unshift({id:uid(),...o,by:S.cfg.name});
 if(ty==='out')S.mem[cat]=scope;EDT=null;MON=o.d.slice(0,7);save();render();toast('已儲存 ✨')}
function editTx(id){EDT=id;render();setTimeout(()=>{const x=$('txf');x&&x.scrollIntoView({behavior:'smooth'})},50)}
function delTx(){S.tx=S.tx.filter(x=>x.id!==EDT);EDT=null;save();render();toast('已刪除')}
function pickCat(){const c=v('a_cat');if(S.mem[c])$('a_scope').value=S.mem[c]}
const selC=i=>{CSEL=CSEL===CL[i]?'':CL[i];render()};
function pie(E,tot){const R=70,r=44,P=(a,q)=>[80+q*Math.cos(a),80+q*Math.sin(a)];let a0=-Math.PI/2,h='';
 E.forEach(([c,n],i)=>{const f=n/tot,a1=a0+f*2*Math.PI,col=PAL[i%PAL.length],op=CSEL&&CSEL!==c?.35:1;
  if(f>.9999)h+=`<circle cx="80" cy="80" r="${R}" fill="${col}" onclick="selC(${i})"/>`;
  else{const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R);h+=`<path d="M${x0},${y0}A${R},${R} 0 ${f>.5?1:0} 1 ${x1},${y1}L80,80Z" fill="${col}" onclick="selC(${i})" style="cursor:pointer;opacity:${op}"/>`}a0=a1});
 return `<svg viewBox="0 0 160 160" width="150" style="flex:none">${h}<circle cx="80" cy="80" r="${r}" fill="var(--card)"/><text x="80" y="76" text-anchor="middle" style="font-size:9px;fill:var(--mu)">總支出</text><text x="80" y="92" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--tx)">${money(tot)}</text></svg>`}
const trow=t=>`<div class="tr" onclick="editTx('${t.id}')"><span class="mu">${t.d.slice(5).replace('-','/')}</span><span>${icon(t.cat)} ${e(t.cat)}</span><span class="mu">${e(t.note)||'—'}・${t.scope==='s'?'共用':'個人'}・${e(t.by)}${t.acct==='信用卡'?' 💳'+e(crd(t).name):''}</span><b class="am">${t.type==='in'?'+':'-'}${money(t.amt)}</b></div>`;
function txForm(){const t=S.tx.find(x=>x.id===EDT)||{type:'out',amt:'',cat:SEL.out||S.cats.out[0][0],scope:'p',acct:'信用卡',note:'',d:td()};
 const o=(a,b,l)=>`<option value="${a}" ${b===a?'selected':''}>${l||a}</option>`;
 return `<div class="card" id="txf"><h2>${EDT?'✏️ 修改這筆':'新增一筆'}</h2><div class="row"><select id="a_type">${o('out',t.type,'支出')}${o('in',t.type,'收入')}</select><input id="a_amt" type="number" inputmode="decimal" placeholder="金額" value="${t.amt}"></div>
 <div class="row" style="margin-top:8px"><select id="a_cat" onchange="onCat('out')">${catOpts('out',t.cat)}</select><select id="a_scope">${o('p',t.scope,'👤 個人')}${o('s',t.scope,'👨‍👩‍👧 共用')}</select><select id="a_acct" onchange="$('a_card').style.display=this.value==='信用卡'?'':'none'">${o('現金',t.acct)}${o('信用卡',t.acct==='電子支付'?'信用卡':t.acct)}</select><select id="a_card" style="${t.acct==='現金'?'display:none':''}">${S.cards.map(c=>`<option value="${c.id}" ${(t.card||S.cfg.lastCard||'')===c.id?'selected':''}>💳 ${e(c.name)}</option>`).join('')}</select></div>${ncUI('out')}
 <div class="row" style="margin-top:8px"><input id="a_d" type="date" value="${t.d}"><input id="a_note" placeholder="備註" value="${e(t.note)}"></div>
 <div class="row" style="margin-top:10px"><button style="flex:1" onclick="addTx()">${EDT?'儲存修改':'記下來 ✨'}</button>${EDT?'<button class="g" onclick="EDT=null;render()">取消</button><button class="g" onclick="delTx()">刪除</button>':''}</div></div>`}
function pGen(){const f=fin(MON),bal=f.inc-f.out,cats={};
 f.cur.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
 const E=Object.entries(cats).sort((a,b)=>b[1]-a[1]),tot=E.reduce((a,x)=>a+x[1],0),bp=S.cfg.budget?Math.min(100,f.out/S.cfg.budget*100):0;CL=E.map(x=>x[0]);
 const L=f.cur.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0),det=L.filter(t=>t.type==='out'&&t.cat===CSEL),c=CC();
 return `<div class="row" style="margin-bottom:10px">${['all','p','s'].map(k=>`<span class="chip ${view===k?'on':''}" onclick="view='${k}';render()">${vname[k]}</span>`).join('')}</div>
 <div class="row sp" style="margin-bottom:10px"><button class="s g" onclick="MON=addM(MON,-1);CSEL='';EDT=null;render()">◀</button><b>${MON.slice(0,4)} 年 ${+MON.slice(5)} 月</b><button class="s g" onclick="MON=addM(MON,1);CSEL='';EDT=null;render()">▶</button></div>
 <div class="card"><div class="row sp"><div><div class="mu">結餘(${vname[view]})</div><div class="big">${money(bal)}</div></div><div class="mu" style="text-align:right">收入 ${money(f.inc)}${f.carry?`<br>含上月結轉 ${money(f.carry)}`:''}<br>支出 ${money(f.out)}</div></div>
 <div class="bar" style="margin:10px 0 4px"><i style="width:${bp}%"></i></div><div class="mu">預算 ${money(S.cfg.budget)},已用 ${Math.round(bp)}% ${bp>=100?'(超過囉,下個月再調整就好 (・ω・))':''}</div></div>
 <div class="card"><h2>分類支出</h2>${E.length?`<div class="row" style="flex-wrap:nowrap;gap:10px">${pie(E,tot)}<div style="flex:1;min-width:0">${E.map(([k,n],i)=>`<div class="row sp" onclick="selC(${i})" style="cursor:pointer;flex-wrap:nowrap;padding:3px 0;${CSEL&&CSEL!==k?'opacity:.45':''}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PAL[i%PAL.length]}"></i> ${icon(k)}${e(k)}</span><span class="mu" style="white-space:nowrap">${Math.round(n/tot*100)}%・${money(n)}</span></div>`).join('')}</div></div>
 ${CSEL?`<h2 style="margin-top:10px">${icon(CSEL)} ${e(CSEL)} 明細</h2>${det.map(trow).join('')}`:'<div class="mu" style="margin-top:6px">點圓餅圖或分類,可以看該類別的明細</div>'}`:'<div class="mu">這個月還沒有支出 (´・ω・`)</div>'}</div>
 ${txForm()}
 <div class="card"><h2>本月紀錄 <span class="mu">(點一下可修改)</span></h2>${L.map(trow).join('')||'<div class="mu">空空的</div>'}</div>`}

const vch=()=>`<div class="row" style="margin-bottom:10px">${['all','p','s'].map(k=>`<span class="chip ${view===k?'on':''}" onclick="view='${k}';render()">${vname[k]}</span>`).join('')}</div>`;
function addCard(){const n=v('cd_n').trim();if(!n)return;S.cards.push({id:uid(),name:n,close:+v('cd_c')||23,pay:+v('cd_p')||10});save();render();toast('已新增卡片')}
function updCard(id,k,x){const c=S.cards.find(z=>z.id===id);c[k]=k==='name'?(x.trim()||c.name):Math.min(31,Math.max(1,+x||c[k]));save();render()}
function delCard(id){if(confirm('刪除這張卡?原本的刷卡紀錄會變成「未指定」')){S.cards=S.cards.filter(c=>c.id!==id);save();render()}}
function pCard(){const cs=allCards(),sel=cs.find(c=>c.id===CSELC)?CSELC:'',I=(sel?cs.filter(c=>c.id===sel):cs).map(cardInfo),
 tot=I.reduce((a,x)=>a+(x.unpaid?x.prevSum:0),0),cur=I.reduce((a,x)=>a+x.curSum,0);
 return vch()+`<div class="row" style="margin-bottom:10px"><span class="chip ${sel===''?'on':''}" onclick="CSELC='';render()">全部卡片</span>${cs.map(c=>`<span class="chip ${sel===c.id?'on':''}" onclick="CSELC='${c.id}';render()">${e(c.name)}</span>`).join('')}</div>
 <div class="card"><div class="row sp"><div><div class="mu">待繳款合計</div><div class="big">${money(tot)}</div></div><div style="text-align:right"><div class="mu">目前累積(下一期)</div><b>${money(cur)}</b></div></div></div>
 ${I.map(x=>`<div class="card"><div class="row sp"><b>💳 ${e(x.c.name)}</b><span class="mu">每月 ${x.c.close} 號結帳・${x.c.pay} 號繳款</span></div>
 ${x.unpaid?`<div class="li"><span>待繳(${mdl(x.prev)} 結帳)</span><span><b>${money(x.prevSum)}</b> <span class="mu">${mdl(x.prevPay)} 前・剩 ${days(td(),x.prevPay)} 天</span></span></div>`:''}
 <div class="li"><span>目前累積(${mdl(x.cur)} 結帳)</span><span><b>${money(x.curSum)}</b> <span class="mu">${mdl(x.curPay)} 繳款</span></span></div>

async function api(path,body){const y=S.sync,r=await fetch(y.api.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+y.token},body:body?JSON.stringify(body):undefined});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
const docs=()=>{const c={};S.tx.forEach(t=>c['tx:'+t.id]={scope:t.scope,data:t});S.items.forEach(i=>c['item:'+i.id]={scope:'s',data:i});S.log.forEach(l=>c['log:'+l.d]={scope:'p',data:l});c.cfg={scope:'p',data:{cfg:S.cfg,mem:S.mem,cats:S.cats,cards:S.cards}};return c};
function ap(res,y){let n=0;const c=docs(),ks=[];
 for(const d of res.docs){const k=d.k,i=k.indexOf(':'),t=k.slice(0,i),id=k.slice(i+1);
  if(k==='cfg'){if(!d.del){if(hs(d.data)!==hs(c.cfg.data)){Object.assign(S.cfg,d.data.cfg);S.mem=d.data.mem;S.cats=d.data.cats;S.cats.loc=S.cats.loc||DEFLOC();if(d.data.cards)S.cards=d.data.cards;n++}ks.push(k)}continue}
  const L={tx:S.tx,item:S.items,log:S.log}[t];if(!L)continue;const f=t==='log'?'d':'id',j=L.findIndex(x=>x[f]===id);
  if(d.del){if(j>=0){L.splice(j,1);n++}delete y.h[k]}
  else if(j<0){L.push(d.data);n++;ks.push(k)}
  else{if(hs(d.data)!==hs(L[j])){L[j]=d.data;n++}ks.push(k)}}
 S.tx.sort((a,b)=>a.d<b.d?1:-1);
 const c2=docs();ks.forEach(k=>{if(c2[k])y.h[k]=[hs(c2[k].data),c2[k].scope]});y.since=res.now-5000;return n}
async function sync(){const y=S.sync;if(!y.token||!y.api||busy)return;busy=1;let n=0;
 try{if(!y.since)n+=ap(await api('/api/sync',{since:0,docs:[]}),y);
  const c=docs(),now=Date.now(),push=[];
  for(const k in c){const h=hs(c[k].data);if(!y.h[k]||y.h[k][0]!==h)push.push({k,scope:c[k].scope,data:c[k].data,u:now,h})}
  for(const k in y.h)if(!(k in c))push.push({k,del:1,scope:y.h[k][1],u:now});
  for(let i=0;i<Math.max(1,push.length);i+=100){const ch=push.slice(i,i+100);
   const r=await api('/api/sync',{since:y.since,docs:ch.map(({h,...d})=>d)});
   ch.forEach(d=>{if(d.del)delete y.h[d.k];else y.h[d.k]=[d.h,d.scope]});n+=ap(r,y)}
  ST.msg=''}catch(x){ST.msg='同步失敗:'+x.message}
 busy=0;raw();if(n)render()}
async function startPair(){try{const y=S.sync,r=await fetch(y.api.replace(/\/$/,'')+'/api/pair',{method:'POST'}).then(r=>r.json());y.token=r.token;ST={code:r.code,bot:r.bot};raw();render();poll()}catch(x){ST.msg='連線失敗,請確認後端網址';render()}}
async function poll(){if(!ST.code)return;try{const m=await api('/api/me');if(m.bound){ST={};raw();sync();render();return}}catch(x){if(String(x.message)==='auth'){S.sync.token='';ST={msg:'配對碼已過期,請重新連結'};raw();render();return}}setTimeout(poll,3000)}
async function loadMe(){ST.me={};try{ST.me=await api('/api/me')}catch(x){ST.me={err:1}}render()}
async function savePrefs(){try{await api('/api/prefs',{name:S.cfg.name,hour:+v('r_h'),stock:$('r_s').checked,health:$('r_hh').checked,fin:$('r_f').checked});ST.msg='已儲存提醒設定'}catch(x){ST.msg='儲存失敗'}loadMe()}
async function mkInv(){try{ST.inv=(await api('/api/family/invite',{})).code}catch(x){ST.msg='產生失敗'}render()}
async function joinFam(){try{await api('/api/family/join',{code:v('j_c').trim()});S.sync.since=0;ST.msg='已加入家庭!';await sync();loadMe();return}catch(x){ST.msg=x.message}render()}
function setApi(){S.sync.api=v('s_api').trim();raw();render()}
function unlink(){if(confirm('中斷連線並清除後端網址?資料仍保留在本機。')){S.sync={api:'',token:'',since:0,h:{}};ST={};raw();render()}}
const cloud=()=>{const y=S.sync,m=ST.me;let h='<div class="card"><h2>☁️ 雲端同步與 Telegram</h2>';
 if(!y.api)h+='<div class="mu">貼上後端網址(部署 Worker 後取得)</div><div class="row"><input id="s_api" placeholder="https://life-api.xxx.workers.dev"><button class="s" onclick="setApi()">儲存</button></div>';
 else if(!y.token)h+='<button onclick="startPair()">連結 Telegram</button>';
 else if(ST.code)h+=`<div class="bub">請在 Telegram 對 @${e(ST.bot)} 傳送這組配對碼:<div class="big">${ST.code}</div>10 分鐘內有效,成功後會自動更新。</div>`;
 else if(m&&m.bound){h+=`<div class="mu">✅ 已連線・家庭成員:${m.members.map(e).join('、')}</div>
 <div class="row" style="margin:8px 0"><button class="s" onclick="sync().then(render)">立即同步</button><button class="s g" onclick="mkInv()">產生家人邀請碼</button></div>${ST.inv?`<div class="bub">邀請碼 <b>${ST.inv}</b>(24 小時內有效),請家人在自己的 App 輸入。</div>`:''}
 <div class="row" style="margin:8px 0"><input id="j_c" placeholder="輸入邀請碼加入家庭"><button class="s" onclick="joinFam()">加入</button></div>
 <h2 style="margin-top:10px">Telegram 提醒</h2><div class="row"><select id="r_h">${[...Array(24).keys()].map(i=>`<option value="${i}" ${m.prefs.hour===i?'selected':''}>每天 ${i}:00</option>`).join('')}</select></div>
 ${[['r_s','stock','日用品快用完/快過期'],['r_hh','health','健康鼓勵'],['r_f','fin','今天還沒記帳']].map(([i,k,n])=>`<label class="li"><span>${n}</span><input id="${i}" type="checkbox" style="flex:none" ${m.prefs[k]?'checked':''}></label>`).join('')}<button class="s" onclick="savePrefs()">儲存提醒設定</button>`}
 else h+='<div class="mu">'+(m&&m.err?'連線失敗,請確認後端網址與網路':'載入中…')+'</div>';
 return h+(ST.msg?`<div class="mu" style="margin-top:6px">${e(ST.msg)}</div>`:'')+(y.api?'<div class="mu" style="margin-top:8px"><a onclick="unlink()">中斷連線/更換網址</a></div>':'')+'</div>'};
/* ---------- overview & settings ---------- */
function pMain(){const m=S.cfg.mods,t=td(),f=fin(t.slice(0,7)),today=S.tx.filter(x=>x.d===t&&x.type==='out').reduce((a,x)=>a+x.amt,0);
 return `<h1>${S.cfg.mascot} 嗨,${e(S.cfg.name)}!</h1>
 ${m.fin?`<div class="card" onclick="tab='fin';render()"><div class="mu">💰 今日支出</div><div class="big">${money(today)}</div><div class="mu">本月結餘 ${money(f.inc-f.out)}</div><div class="mu">💳 ${cardLine()}</div></div>`:''}
 ${m.home?`<div class="card" onclick="tab='home';render()"><div class="mu">🧺 快用完的品項</div>${S.items.filter(i=>stat(i).low).map(i=>`<div>${e(i.name)}</div>`).join('')||'<div class="mu">目前都夠用 (๑˃ᴗ˂)ﻭ</div>'}${expSoon().map(x=>`<div class="warn">⏰ ${expTxt(x)}</div>`).join('')}</div>`:''}
 ${m.health?`<div class="card" onclick="tab='health';render()"><div class="mu">🌿 小助手說</div><div class="bub" style="margin-top:6px">${coach()}</div></div>`:''}
 ${!m.fin&&!m.home&&!m.health?'<div class="card mu">到「設定」開啟想用的功能吧 ✨</div>':''}`}
function setMod(k,x){S.cfg.mods[k]=x?1:0;save();render()}
function pSet(){const c=S.cfg;return `<h1>⚙️ 設定</h1><div class="card"><h2>顯示的功能</h2>${[['fin','💰 記帳'],['home','🧺 日用品'],['health','🌿 健康']].map(([k,n])=>`<label class="li"><span>${n}</span><input type="checkbox" style="flex:none" ${c.mods[k]?'checked':''} onchange="setMod('${k}',this.checked)"></label>`).join('')}</div>
 <div class="card"><h2>風格</h2><div class="row">${THEMES.map(([k,n])=>`<span class="chip ${c.theme===k?'on':''}" onclick="S.cfg.theme='${k}';save();render()">${n}</span>`).join('')}</div>
 <div class="mu" style="margin:10px 0 4px">自訂主色</div><div class="row"><input type="color" style="flex:none;padding:2px;width:48px;height:36px" value="${c.custom||'#ff8fa3'}" onchange="S.cfg.custom=this.value;save();render()"><button class="g s" onclick="S.cfg.custom='';save();render()">還原主題色</button></div>
 <div class="mu" style="margin:10px 0 4px">圓角</div><div class="row">${[['8px','方正'],['18px','圓潤'],['30px','超圓']].map(([k,n])=>`<span class="chip ${c.round===k?'on':''}" onclick="S.cfg.round='${k}';save();render()">${n}</span>`).join('')}</div>
 <div class="mu" style="margin:10px 0 4px">吉祥物</div><div class="row">${['🐰','🐱','🐻','🐶','🦊','🐼','🐥'].map(k=>`<span class="chip ${c.mascot===k?'on':''}" onclick="S.cfg.mascot='${k}';save();render()">${k}</span>`).join('')}</div></div>
 <div class="card"><h2>我的類別</h2>${[['out','記帳'],['item','日用品'],['loc','存放位置']].map(([k,n])=>`<div class="mu" style="margin-top:6px">${n}</div><div class="row">${S.cats[k].map((x,i)=>`<span class="chip">${x[1]} ${e(x[0])} <a onclick="S.cats['${k}'].splice(${i},1);save();render()">✕</a></span>`).join('')}</div>`).join('')}<div class="mu" style="margin-top:8px">新增類別:到記帳或日用品的類別選單,選「＋新增類別」</div></div>
 <div class="card"><h2>💳 預設結帳日/繳款日</h2><div class="row"><label class="mu" style="flex:1 1 120px;display:block">結帳日(每月幾號)<input type="number" min="1" max="31" style="width:100%" value="${c.cardClose}" onchange="S.cfg.cardClose=Math.min(31,Math.max(1,+this.value||23));save();render()"></label><label class="mu" style="flex:1 1 120px;display:block">繳款日(每月幾號)<input type="number" min="1" max="31" style="width:100%" value="${c.cardPay}" onchange="S.cfg.cardPay=Math.min(31,Math.max(1,+this.value||10));save();render()"></label></div><div class="mu" style="margin-top:6px">結帳日(含)以前的刷卡算本期,隔天起算下一期。繳款日若比結帳日小,就是結帳隔月才繳。這是沒指定卡片時的預設值,各卡片可在「記帳 → 信用卡 → 管理信用卡」分別設定。</div></div>
 <div class="card"><h2>個人設定</h2><div class="row"><input value="${e(c.name)}" placeholder="暱稱" onchange="S.cfg.name=this.value;save()"><input type="number" value="${c.budget}" onchange="S.cfg.budget=+this.value||0;save()"></div><div class="mu">左:暱稱(顯示為記帳者) 右:每月預算</div>
 <label class="li"><span>上月結餘自動轉為本月收入</span><input type="checkbox" style="flex:none" ${c.carry?'checked':''} onchange="S.cfg.carry=this.checked?1:0;save();render()"></label></div>
 ${cloud()}<div class="card mu">資料先存在這台裝置,連上雲端後會自動同步。<br><button class="g s" style="margin-top:8px" onclick="if(confirm('確定清除全部資料?')){S=JSON.parse(JSON.stringify(DEF));save();render()}">清除全部資料</button></div>`}

function render(){const m=S.cfg.mods;if(tab==='set'&&S.sync.token&&!ST.me&&!ST.code){ST.me={};loadMe()}document.documentElement.dataset.theme=S.cfg.theme;const rs=document.documentElement.style;rs.setProperty('--r',S.cfg.round||'18px');S.cfg.custom?(rs.setProperty('--ac',S.cfg.custom),rs.setProperty('--ac2','color-mix(in srgb,'+S.cfg.custom+' 22%,var(--card))')):(rs.removeProperty('--ac'),rs.removeProperty('--ac2'));{const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#fff3ee'}
 const T=[['main','🏠','總覽'],m.fin&&['fin','💰','記帳'],m.home&&['home','🧺','日用品'],m.health&&['health','🌿','健康'],['set','⚙️','設定']].filter(Boolean);
 if(tab==='home'&&!m.home&&!T.find(x=>x[0]==='home'))tab='main';
 if(!T.find(x=>x[0]===tab))tab='main';
 $('nav').innerHTML=T.map(([k,i,n])=>`<a class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</a>`).join('');
 $('app').innerHTML={main:pMain,fin:pFin,home:pHome,health:pHealth,set:pSet}[tab]()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tab='main';render();sync();document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script></body></html>
